name: Port probe

# Temporary.  Two measurements that gate the macOS and Windows sandbox ports,
# per STATUS.md: whether macOS can cap memory at all, and whether the Windows
# filesystem confinement can be had without granting a package SID an ACE on
# the Octave installation.  Manual trigger only, so it never runs beside the
# real CI.  Nothing here fails on a "no": a refusal is the reading.  Delete
# this file once both answers are recorded in the plan.

on:
  workflow_dispatch:
    inputs:
      macos:
        description: 'Run the macOS memory measurement'
        type: boolean
        default: true
      windows:
        description: 'Run the Windows confinement measurement'
        type: boolean
        default: true

permissions:
  contents: read

jobs:

  ## ----------------------------------------------------------------------
  ## Measurement 1.  Can macOS cap memory at all?
  ##
  ## On Linux the cap is one prlimit at relaunch (VmSize + 2 GB), and the
  ## inside check refuses to serve when /proc/self/limits shows no address
  ## space limit.  Darwin accepts RLIMIT_AS and is said not to enforce it,
  ## has no prlimit and no /proc.  Three things must hold for the port to
  ## keep the Linux shape: the limit can be set, it binds, and it can be read
  ## from inside.  Each is measured on its own.
  ## ----------------------------------------------------------------------
  macos-memory:
    name: macOS, can memory be capped
    if: inputs.macos
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: The machine
        run: |
          set +e
          echo "--- arch and release ---"
          uname -a
          sw_vers
          echo "hw.memsize  $(sysctl -n hw.memsize)"
          echo "ncpu        $(sysctl -n hw.ncpu)"
          echo "--- the shell's own limits ---"
          ulimit -a
          echo "--- is there a prlimit ---"
          command -v prlimit || echo "prlimit: absent, as expected"

          # macOS carries no coreutils timeout, and a probe must not be able
          # to wedge: under a 2 GB address space limit Octave was measured on
          # Linux to hang rather than to fail to start.  Perl is on every
          # macOS, so the bound is written once here for the steps below.
          cat > limited <<'PERL'
          #!/usr/bin/perl
          my $t = shift;
          my $killed = 0;
          my $pid = fork ();
          die "fork failed\n" if (! defined $pid);
          if ($pid == 0) { exec @ARGV; exit 127; }
          $SIG{ALRM} = sub { $killed = 1; kill 9, $pid; };
          alarm $t;
          waitpid ($pid, 0);
          my $rc = $?;
          exit ($killed ? 124 : ($rc & 127 ? 128 + ($rc & 127) : $rc >> 8));
          PERL
          chmod +x limited
          ./limited 5 /bin/sh -c 'sleep 60'
          echo "the bound works: exit $? (124 expected)"

      - name: Does RLIMIT_AS bind a C program
        run: |
          set +e
          cat > alloc.c <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          /* Allocate and touch argv[1] megabytes, 64 at a time, reporting how
             far it got.  Nothing is freed, deliberately.  Exit 2 means malloc
             refused, 0 means the whole amount was taken, and a signal means
             the kernel stopped it instead. */
          int main (int argc, char **argv)
          {
            long want = atol (argv[1]), step = 64, got = 0;
            while (got < want)
              {
                char *p = malloc (step * 1024L * 1024L);
                if (p == NULL)
                  {
                    printf ("malloc refused at %ld MB\n", got);
                    fflush (stdout);
                    return 2;
                  }
                memset (p, 1, step * 1024L * 1024L);
                got += step;
              }
            printf ("took and touched %ld MB\n", got);
            return 0;
          }
          C
          cc -O0 -o alloc alloc.c || exit 0

          run () {          # run () <title> <ulimit flag> <value> <ask MB>
            printf -- '--- %s ---\n' "$1"
            (
              ulimit "$2" "$3" 2>/dev/null || echo "ulimit $2 $3 was refused"
              echo "in force: $(ulimit "$2")"
              ./alloc "$4"
              echo "exit status $?"
            )
          }

          run "control, no limit, ask 2048 MB"     -v unlimited 2048
          run "RLIMIT_AS   (-v) 1 GB, ask 2048 MB" -v 1048576   2048
          run "RLIMIT_DATA (-d) 1 GB, ask 2048 MB" -d 1048576   2048
          run "RLIMIT_RSS  (-m) 1 GB, ask 2048 MB" -m 1048576   2048

      - name: Install Octave
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          set -euo pipefail
          brew install octave
          octave-cli --norc --no-history --eval "disp (version ())"

      - name: What Octave reserves at start
        run: |
          set +e
          # The Linux budget is VmSize + 2 GB, so the port needs a base to add
          # to.  On arm64 the reported virtual size may be so large that no
          # such formula is usable; that is the reading being taken.
          look () {
            printf -- '--- %s ---\n' "$1"
            shift
            env "$@" octave-cli --norc --no-history --eval "pause (25);" &
            pid=$!
            sleep 12
            echo "        VSZ kB      RSS kB"
            ps -o vsz=,rss= -p $pid
            kill -9 $pid 2>/dev/null
            wait $pid 2>/dev/null
          }
          look "default thread count" DEVTOOLS_PROBE=1
          look "one BLAS thread" OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 \
                                 VECLIB_MAXIMUM_THREADS=1

      - name: Does Octave start under a limit, and is an allocation refused
        run: |
          set +e
          # No prlimit on Darwin, so the relaunch route is a shell that sets
          # the limit and execs.  Whether the limit binds is the question: a
          # zeros () past it should fail with Octave's own error rather than
          # succeed or be killed.
          cat > cap.m <<'M'
          n = str2double (getenv ("PROBE_N"));
          t = tic;
          try
            x = zeros (n);
            printf ("allocated %.2f GB in %.2f s\n", numel (x) * 8 / 2^30, ...
                    toc (t));
          catch err
            printf ("refused after %.2f s: %s\n", toc (t), err.message);
          end_try_catch
          M

          # Every launch is bounded: under a 2 GB cap Octave was measured on
          # Linux to hang rather than to refuse to start, so a probe that did
          # not bound it could not finish.
          said () {
            if [ "$1" -eq 124 ]; then
              echo "exit status 124: it hung and was stopped"
            else
              echo "exit status $1"
            fi
          }
          start () {                   # start () <kb or unlimited>
            printf -- '--- cap %s kB, does it start ---\n' "$1"
            ./limited 120 /bin/sh -c "ulimit -v $1 2>/dev/null
              exec octave-cli --norc --no-history --eval 'disp (\"started\")'"
            said $?
          }
          try () {                     # try () <kb or unlimited> <N>
            printf -- '--- cap %s kB, zeros (%s) ---\n' "$1" "$2"
            PROBE_N="$2" ./limited 300 /bin/sh -c "ulimit -v $1 2>/dev/null
              exec octave-cli --norc --no-history '$PWD/cap.m'"
            said $?
          }

          echo "### the floor: what cap lets Octave start at all"
          for kb in 2097152 4194304 8388608 16777216; do
            start "$kb"
          done

          # An ask under the cap and an ask over it, so the two answers differ
          # visibly where the cap binds and not at all where it is ignored.
          # 0.48 GB fits any of these caps; 5.84 GB fits none.
          echo "### control, no cap"
          try unlimited 8000
          echo "### an absolute 4 GB cap"
          try 4194304 8000           # 0.48 GB: passes either way
          try 4194304 28000          # 5.84 GB: refused only if the cap binds

          # The Linux cap is not absolute, it is Octave's own size plus a
          # budget, so the same shape is measured here.  Where the virtual
          # size is unusable as a base this arm says so by passing both.
          octave-cli --norc --no-history --eval "pause (25);" &
          pid=$!
          sleep 12
          base=$(ps -o vsz= -p $pid | tr -d ' ')
          kill -9 $pid 2>/dev/null
          wait $pid 2>/dev/null
          echo "### Octave's own size, $base kB, plus a 1 GB budget"
          if [ -n "$base" ]; then
            try $((base + 1048576)) 8000     # 0.48 GB: inside the budget
            try $((base + 1048576)) 16384    # 2.00 GB: outside it
          else
            echo "no virtual size could be read, so no relative cap was tried"
          fi

      - name: Can the limit be read from inside
        run: |
          set +e
          # The Linux check reads /proc/self/limits.  Darwin has none, so the
          # candidates are a shell (which the confinement may forbid), an
          # oct-file over getrlimit, or an allocation that must fail.  The
          # last is timed here, being the only one that needs nothing.
          cat > inside.m <<'M'
          [s, t] = system ("ulimit -v");
          printf ("through a shell: status %d, %s", s, t);
          t0 = tic;
          try
            x = zeros (40000);
            printf ("the empirical probe did not bind\n");
          catch
            printf ("the empirical probe bound in %.3f s\n", toc (t0));
          end_try_catch
          M
          echo "--- /proc ---"
          ls /proc 2>&1 | head -3 || echo "no /proc, as expected"
          echo "--- what a shell reports under a cap ---"
          /bin/sh -c 'ulimit -v 8388608 2>/dev/null
                      echo "soft $(ulimit -S -v)  hard $(ulimit -H -v)"'
          echo "--- what Octave can see of it under an 8 GB cap ---"
          ./limited 300 /bin/sh -c "ulimit -v 8388608 2>/dev/null
            exec octave-cli --norc --no-history '$PWD/inside.m'"
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "exit status 124: it hung and was stopped"
          else
            echo "exit status $rc"
          fi

      - name: Is Seatbelt reachable at all
        run: |
          set +e
          # Not the measurement, but the port has no filesystem story without
          # it and the reading is three lines.
          echo "--- sandbox-exec present ---"
          command -v sandbox-exec || echo "absent"
          echo "--- a permissive profile ---"
          sandbox-exec -p '(version 1)(allow default)' /usr/bin/true \
            && echo "ran" || echo "refused, exit $?"
          echo "--- a profile denying the network ---"
          sandbox-exec -p '(version 1)(allow default)(deny network*)' \
            /usr/bin/curl -s -m 10 -o /dev/null https://example.com \
            && echo "the network was NOT blocked" || echo "network blocked"

  ## ----------------------------------------------------------------------
  ## Measurement 2.  Windows filesystem confinement without an ACE on the
  ## Octave installation.
  ##
  ## An AppContainer reads only what carries an ACE for its package SID or
  ## for ALL APPLICATION PACKAGES; a managed university lab image may not
  ## permit adding one to the Octave installation.  Three arms: the
  ## AppContainer with and without that ACE, the same over a private copy,
  ## and a low integrity token, which needs no ACE but confines writes only.
  ## The job object memory cap is measured here too, being the Windows half
  ## of measurement 1.
  ## ----------------------------------------------------------------------
  windows-confinement:
    name: Windows, confinement without an ACE
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      OCTAVE_VERSION: '11.3.0'
      # A probe reads what fails as readily as what works, so a non-zero
      # native exit code must not end the step.
      PSNativeCommandUseErrorActionPreference: 'false'
    steps:
      - uses: actions/checkout@v7

      - name: Install Octave
        uses: pr0m1th3as/octave-ci/windows@v1
        with:
          version: '11.3.0'

      - name: The machine and the installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          [Environment]::OSVersion | Format-List
          $id = [Security.Principal.WindowsIdentity]::GetCurrent ()
          $pr = New-Object Security.Principal.WindowsPrincipal ($id)
          $admin = [Security.Principal.WindowsBuiltInRole]::Administrator
          "running as admin: " + $pr.IsInRole ($admin)
          $root = "C:\octave-ci\octave-$env:OCTAVE_VERSION-w64"
          "octave root: $root"
          $f = Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue $root
          "files: {0}, size: {1:N2} GB" -f $f.Count,
            (($f | Measure-Object -Property Length -Sum).Sum / 1GB)
          "--- what the installation already grants ---"
          icacls $root

      - name: Compile the spawner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          # Written to a file so that every later step loads the same source
          # and a compile error is one step's failure, not the job's.
          @'
          using System;
          using System.Runtime.InteropServices;
          using System.Security.Principal;
          using System.Text;

          public static class Spawn
          {
            [StructLayout (LayoutKind.Sequential)]
            public struct STARTUPINFO {
              public int cb; public IntPtr r1, d, t;
              public int dwX, dwY, dwXSize, dwYSize, dwXCountChars,
                         dwYCountChars, dwFillAttribute, dwFlags;
              public short wShowWindow, cbReserved2;
              public IntPtr lpReserved2, hStdInput, hStdOutput, hStdError;
            }
            [StructLayout (LayoutKind.Sequential)]
            public struct STARTUPINFOEX {
              public STARTUPINFO StartupInfo; public IntPtr lpAttributeList;
            }
            [StructLayout (LayoutKind.Sequential)]
            public struct PROCESS_INFORMATION {
              public IntPtr hProcess, hThread; public int pid, tid;
            }
            [StructLayout (LayoutKind.Sequential)]
            public struct SECURITY_CAPABILITIES {
              public IntPtr AppContainerSid, Capabilities;
              public int CapabilityCount, Reserved;
            }
            [StructLayout (LayoutKind.Sequential)]
            public struct SID_AND_ATTRIBUTES {
              public IntPtr Sid; public uint Attributes;
            }
            [StructLayout (LayoutKind.Sequential)]
            public struct TOKEN_MANDATORY_LABEL {
              public SID_AND_ATTRIBUTES Label;
            }
            [StructLayout (LayoutKind.Sequential)]
            public struct IO_COUNTERS {
              public ulong a, b, c, d, e, f;
            }
            [StructLayout (LayoutKind.Sequential)]
            public struct JOBOBJECT_BASIC_LIMIT_INFORMATION {
              public long PerProcessUserTimeLimit, PerJobUserTimeLimit;
              public uint LimitFlags;
              public UIntPtr MinimumWorkingSetSize, MaximumWorkingSetSize;
              public uint ActiveProcessLimit;
              public UIntPtr Affinity;
              public uint PriorityClass, SchedulingClass;
            }
            [StructLayout (LayoutKind.Sequential)]
            public struct JOBOBJECT_EXTENDED_LIMIT_INFORMATION {
              public JOBOBJECT_BASIC_LIMIT_INFORMATION BasicLimitInformation;
              public IO_COUNTERS IoInfo;
              public UIntPtr ProcessMemoryLimit, JobMemoryLimit,
                             PeakProcessMemoryUsed, PeakJobMemoryUsed;
            }

            [DllImport ("userenv.dll", CharSet = CharSet.Unicode)]
            static extern int CreateAppContainerProfile (string name,
              string display, string desc, IntPtr caps, int count,
              out IntPtr sid);
            [DllImport ("userenv.dll", CharSet = CharSet.Unicode)]
            static extern int DeriveAppContainerSidFromAppContainerName (
              string name, out IntPtr sid);
            [DllImport ("kernel32.dll", SetLastError = true)]
            static extern bool InitializeProcThreadAttributeList (IntPtr list,
              int count, int flags, ref IntPtr size);
            [DllImport ("kernel32.dll", SetLastError = true)]
            static extern bool UpdateProcThreadAttribute (IntPtr list,
              uint flags, IntPtr attribute, IntPtr value, IntPtr size,
              IntPtr previous, IntPtr returned);
            [DllImport ("kernel32.dll", SetLastError = true,
                        CharSet = CharSet.Unicode)]
            static extern bool CreateProcess (string app, StringBuilder cmd,
              IntPtr pa, IntPtr ta, bool inherit, uint flags, IntPtr env,
              string cwd, ref STARTUPINFOEX si, out PROCESS_INFORMATION pi);
            [DllImport ("advapi32.dll", SetLastError = true,
                        CharSet = CharSet.Unicode)]
            static extern bool CreateProcessAsUser (IntPtr token, string app,
              StringBuilder cmd, IntPtr pa, IntPtr ta, bool inherit,
              uint flags, IntPtr env, string cwd, ref STARTUPINFO si,
              out PROCESS_INFORMATION pi);
            [DllImport ("advapi32.dll", SetLastError = true,
                        CharSet = CharSet.Unicode)]
            static extern bool CreateProcessWithTokenW (IntPtr token,
              uint logonFlags, string app, StringBuilder cmd, uint flags,
              IntPtr env, string cwd, ref STARTUPINFO si,
              out PROCESS_INFORMATION pi);
            [DllImport ("advapi32.dll", SetLastError = true)]
            static extern bool OpenProcessToken (IntPtr proc, uint access,
              out IntPtr token);
            [DllImport ("advapi32.dll", SetLastError = true)]
            static extern bool DuplicateTokenEx (IntPtr token, uint access,
              IntPtr sa, int level, int type, out IntPtr dup);
            [DllImport ("advapi32.dll", SetLastError = true)]
            static extern bool SetTokenInformation (IntPtr token, int cls,
              ref TOKEN_MANDATORY_LABEL info, int length);
            [DllImport ("advapi32.dll", SetLastError = true,
                        CharSet = CharSet.Unicode)]
            static extern bool ConvertStringSidToSid (string s, out IntPtr sid);
            [DllImport ("kernel32.dll", SetLastError = true,
                        CharSet = CharSet.Unicode)]
            static extern IntPtr CreateJobObject (IntPtr sa, string name);
            [DllImport ("kernel32.dll", SetLastError = true)]
            static extern bool SetInformationJobObject (IntPtr job, int cls,
              IntPtr info, int length);
            [DllImport ("kernel32.dll", SetLastError = true)]
            static extern bool AssignProcessToJobObject (IntPtr job,
              IntPtr proc);
            [DllImport ("kernel32.dll", SetLastError = true)]
            static extern uint ResumeThread (IntPtr thread);
            [DllImport ("kernel32.dll", SetLastError = true)]
            static extern uint WaitForSingleObject (IntPtr h, uint ms);
            [DllImport ("kernel32.dll", SetLastError = true)]
            static extern bool GetExitCodeProcess (IntPtr h, out uint code);
            [DllImport ("kernel32.dll")]
            static extern IntPtr GetCurrentProcess ();
            [DllImport ("kernel32.dll")]
            static extern bool CloseHandle (IntPtr h);

            const uint EXTENDED_STARTUPINFO_PRESENT = 0x00080000;
            const uint CREATE_SUSPENDED = 0x00000004;
            const uint CREATE_NO_WINDOW = 0x08000000;
            static readonly IntPtr SECURITY_CAPABILITIES_ATTRIBUTE =
              (IntPtr) 0x00020009;

            /* The profile's SID, made on the first call, derived after. */
            public static string AppContainerSid (string name)
            {
              IntPtr sid;
              int hr = CreateAppContainerProfile (name, name,
                                                  "devtools port probe",
                                                  IntPtr.Zero, 0, out sid);
              if (hr != 0)
                {
                  hr = DeriveAppContainerSidFromAppContainerName (name,
                                                                 out sid);
                  if (hr != 0)
                    throw new Exception ("no AppContainer SID: 0x"
                                         + hr.ToString ("X8"));
                }
              return new SecurityIdentifier (sid).Value;
            }

            /* Run CMD in the AppContainer of that name.  Returns the exit
               code, or -1 when the process could not be created at all, the
               Win32 error following in ERR. */
            public static int InAppContainer (string name, string cmd,
                                              string cwd, out int err)
            {
              err = 0;
              IntPtr sid;
              if (DeriveAppContainerSidFromAppContainerName (name, out sid)
                  != 0)
                throw new Exception ("the profile does not exist");

              var caps = new SECURITY_CAPABILITIES ();
              caps.AppContainerSid = sid;
              caps.Capabilities = IntPtr.Zero;
              caps.CapabilityCount = 0;

              IntPtr size = IntPtr.Zero;
              InitializeProcThreadAttributeList (IntPtr.Zero, 1, 0, ref size);
              IntPtr list = Marshal.AllocHGlobal (size);
              if (! InitializeProcThreadAttributeList (list, 1, 0, ref size))
                { err = Marshal.GetLastWin32Error (); return -1; }

              int n = Marshal.SizeOf (typeof (SECURITY_CAPABILITIES));
              IntPtr pcaps = Marshal.AllocHGlobal (n);
              Marshal.StructureToPtr (caps, pcaps, false);
              if (! UpdateProcThreadAttribute (list, 0,
                      SECURITY_CAPABILITIES_ATTRIBUTE, pcaps, (IntPtr) n,
                      IntPtr.Zero, IntPtr.Zero))
                { err = Marshal.GetLastWin32Error (); return -1; }

              var si = new STARTUPINFOEX ();
              si.StartupInfo.cb = Marshal.SizeOf (typeof (STARTUPINFOEX));
              si.lpAttributeList = list;
              PROCESS_INFORMATION pi;
              if (! CreateProcess (null, new StringBuilder (cmd),
                                   IntPtr.Zero, IntPtr.Zero, false,
                                   EXTENDED_STARTUPINFO_PRESENT
                                   | CREATE_NO_WINDOW,
                                   IntPtr.Zero, cwd, ref si, out pi))
                { err = Marshal.GetLastWin32Error (); return -1; }

              WaitForSingleObject (pi.hProcess, 300000);
              uint code;
              GetExitCodeProcess (pi.hProcess, out code);
              CloseHandle (pi.hThread);
              CloseHandle (pi.hProcess);
              return (int) code;
            }

            /* Run CMD with this process's token lowered to low integrity. */
            public static int AtLowIntegrity (string cmd, string cwd,
                                              out int err)
            {
              err = 0;
              IntPtr token, dup, low;
              OpenProcessToken (GetCurrentProcess (), 0xF01FF, out token);
              if (! DuplicateTokenEx (token, 0xF01FF, IntPtr.Zero, 2, 1,
                                      out dup))
                { err = Marshal.GetLastWin32Error (); return -1; }
              ConvertStringSidToSid ("S-1-16-4096", out low);
              var label = new TOKEN_MANDATORY_LABEL ();
              label.Label.Sid = low;
              label.Label.Attributes = 0x20;      /* SE_GROUP_INTEGRITY */
              int n = Marshal.SizeOf (typeof (TOKEN_MANDATORY_LABEL)) + 16;
              if (! SetTokenInformation (dup, 25, ref label, n))
                { err = Marshal.GetLastWin32Error (); return -1; }

              var si = new STARTUPINFO ();
              si.cb = Marshal.SizeOf (typeof (STARTUPINFO));
              PROCESS_INFORMATION pi;
              /* CreateProcessAsUser wants a privilege that a session may not
                 have enabled; CreateProcessWithTokenW wants only the one an
                 administrator holds, so it is the fallback rather than the
                 first choice, its logon flags being the coarser interface. */
              if (! CreateProcessAsUser (dup, null, new StringBuilder (cmd),
                                         IntPtr.Zero, IntPtr.Zero, false,
                                         CREATE_NO_WINDOW, IntPtr.Zero, cwd,
                                         ref si, out pi))
                {
                  err = Marshal.GetLastWin32Error ();
                  if (! CreateProcessWithTokenW (dup, 0, null,
                                                 new StringBuilder (cmd),
                                                 CREATE_NO_WINDOW,
                                                 IntPtr.Zero, cwd, ref si,
                                                 out pi))
                    { err = Marshal.GetLastWin32Error (); return -1; }
                  err = 0;
                }

              WaitForSingleObject (pi.hProcess, 300000);
              uint code;
              GetExitCodeProcess (pi.hProcess, out code);
              CloseHandle (pi.hThread);
              CloseHandle (pi.hProcess);
              return (int) code;
            }

            /* Run CMD in a job object capping one process at MB megabytes. */
            public static int InJob (string cmd, string cwd, long mb,
                                     out int err)
            {
              err = 0;
              IntPtr job = CreateJobObject (IntPtr.Zero, null);
              if (job == IntPtr.Zero)
                { err = Marshal.GetLastWin32Error (); return -1; }

              var info = new JOBOBJECT_EXTENDED_LIMIT_INFORMATION ();
              info.BasicLimitInformation.LimitFlags = 0x00000100;
              info.ProcessMemoryLimit = (UIntPtr) (ulong) (mb * 1024 * 1024);
              int len = Marshal.SizeOf (
                typeof (JOBOBJECT_EXTENDED_LIMIT_INFORMATION));
              IntPtr p = Marshal.AllocHGlobal (len);
              Marshal.StructureToPtr (info, p, false);
              if (! SetInformationJobObject (job, 9, p, len))
                { err = Marshal.GetLastWin32Error (); return -1; }

              var si = new STARTUPINFOEX ();
              si.StartupInfo.cb = Marshal.SizeOf (typeof (STARTUPINFO));
              PROCESS_INFORMATION pi;
              if (! CreateProcess (null, new StringBuilder (cmd),
                                   IntPtr.Zero, IntPtr.Zero, false,
                                   CREATE_SUSPENDED | CREATE_NO_WINDOW,
                                   IntPtr.Zero, cwd, ref si, out pi))
                { err = Marshal.GetLastWin32Error (); return -1; }
              if (! AssignProcessToJobObject (job, pi.hProcess))
                { err = Marshal.GetLastWin32Error (); return -1; }
              ResumeThread (pi.hThread);

              WaitForSingleObject (pi.hProcess, 300000);
              uint code;
              GetExitCodeProcess (pi.hProcess, out code);
              CloseHandle (pi.hThread);
              CloseHandle (pi.hProcess);
              return (int) code;
            }
          }
          '@ | Set-Content -Encoding UTF8 spawn.cs
          Add-Type -Path spawn.cs
          "the spawner compiled"

      - name: Prepare the probe folders
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force C:\probe\out | Out-Null
          New-Item -ItemType Directory -Force C:\probe\low | Out-Null
          "secret" | Set-Content C:\probe\secret.txt
          Add-Type -Path spawn.cs
          $sid = [Spawn]::AppContainerSid ("devtools-port-probe")
          "AppContainer SID: $sid"
          $sid | Set-Content C:\probe\sid.txt
          # The container needs somewhere to write or nothing it does can be
          # read back.  That grant is on the probe's own folder, never on the
          # Octave installation, which is the thing being measured.  The grant
          # on C:\probe itself does not inherit, so it opens the way to the
          # output folder without opening the secret beside it.
          icacls C:\probe /grant "*${sid}:(RX)" | Out-Null
          icacls C:\probe\out /grant "*${sid}:(OI)(CI)F" | Out-Null
          # A low integrity process writes only where the label allows it.
          icacls C:\probe\low /setintegritylevel "(OI)(CI)L" | Out-Null
          "folders ready"

      - name: AppContainer without an ACE on the installation
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          Add-Type -Path spawn.cs
          $root = "C:\octave-ci\octave-$env:OCTAVE_VERSION-w64"
          $sys = "$env:SystemRoot\System32"
          $err = 0

          function Show ($what, $file) {
            "--- $what ---"
            if (Test-Path $file) { Get-Content $file } else { "(no output)" }
          }

          # Nothing below can be read if the container cannot write its output
          # folder, so the first probe touches no file at all and answers with
          # its exit code alone: 42 means the container runs.
          $c = "$sys\cmd.exe /c exit 42"
          $rc = [Spawn]::InAppContainer ("devtools-port-probe", $c,
                                         "C:\probe", [ref] $err)
          "a container that touches no file: exit $rc (42 expected), " +
            "win32 error $err"

          # System32 carries ALL APPLICATION PACKAGES by default, so this says
          # whether the container can write where it was granted, before
          # anything is asked of the Octave folder.
          $c = "$sys\cmd.exe /c ver > C:\probe\out\ver.txt 2>&1"
          $rc = [Spawn]::InAppContainer ("devtools-port-probe", $c,
                                         "C:\probe", [ref] $err)
          "cmd.exe in the container: exit $rc, win32 error $err"
          Show "what it printed" C:\probe\out\ver.txt

          $c = "$sys\cmd.exe /c dir `"$root`" > C:\probe\out\dir.txt 2>&1"
          $rc = [Spawn]::InAppContainer ("devtools-port-probe", $c,
                                         "C:\probe", [ref] $err)
          "listing the Octave folder: exit $rc, win32 error $err"
          Show "what it saw" C:\probe\out\dir.txt

          $c = "$root\octave-cli.exe --norc --no-history --eval " +
               "`"disp (version ())`" > C:\probe\out\oct.txt 2>&1"
          $rc = [Spawn]::InAppContainer ("devtools-port-probe", $c,
                                         "C:\probe", [ref] $err)
          "octave-cli in the container: exit $rc, win32 error $err"
          Show "what it printed" C:\probe\out\oct.txt

      - name: AppContainer with the ACE, and what the ACE costs
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          Add-Type -Path spawn.cs
          $root = "C:\octave-ci\octave-$env:OCTAVE_VERSION-w64"
          $sid = Get-Content C:\probe\sid.txt
          $err = 0

          $t = Measure-Command {
            icacls $root /grant "*${sid}:(OI)(CI)RX" /T /C /Q | Out-Null
          }
          "granting read and execute over the installation took " +
            ("{0:N1} s" -f $t.TotalSeconds)

          $c = "$root\octave-cli.exe --norc --no-history --eval " +
               "`"disp (version ()); disp (pwd ())`" " +
               "> C:\probe\out\oct2.txt 2>&1"
          $rc = [Spawn]::InAppContainer ("devtools-port-probe", $c,
                                         "C:\probe", [ref] $err)
          "octave-cli with the ACE: exit $rc, win32 error $err"
          if (Test-Path C:\probe\out\oct2.txt) {
            Get-Content C:\probe\out\oct2.txt
          }

          "--- what the container may read, write and reach ---"
          $c = "$env:SystemRoot\System32\cmd.exe /c " +
               "(type C:\probe\secret.txt & " +
               "echo x > C:\probe\wrote-here.txt & " +
               "curl.exe -s -m 10 -o nul -w ""http %{http_code}"" " +
               "https://example.com) > C:\probe\out\reach.txt 2>&1"
          $rc = [Spawn]::InAppContainer ("devtools-port-probe", $c,
                                         "C:\probe", [ref] $err)
          "the reach probe: exit $rc, win32 error $err"
          if (Test-Path C:\probe\out\reach.txt) {
            Get-Content C:\probe\out\reach.txt
          }
          "wrote outside its grant: " + (Test-Path C:\probe\wrote-here.txt)

      - name: A private copy instead of an ACE on the installation
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          # The escape hatch if a managed image forbids touching the Octave
          # installation: copy it where the profile already has rights.  The
          # cost is disk and one copy, both measured here.
          Add-Type -Path spawn.cs
          $root = "C:\octave-ci\octave-$env:OCTAVE_VERSION-w64"
          $sid = Get-Content C:\probe\sid.txt
          $err = 0

          # Take the grant off the installation again, so this arm cannot
          # borrow it.
          icacls $root /remove "*${sid}" /T /C /Q | Out-Null

          $t = Measure-Command {
            robocopy $root C:\probe\octave /E /NFL /NDL /NJH /NJS /NP /MT:8 |
              Out-Null
          }
          $global:LASTEXITCODE = 0
          $f = Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue `
                 C:\probe\octave
          "the copy: {0} files, {1:N2} GB, {2:N1} s" -f $f.Count,
            (($f | Measure-Object -Property Length -Sum).Sum / 1GB),
            $t.TotalSeconds
          $t = Measure-Command {
            icacls C:\probe\octave /grant "*${sid}:(OI)(CI)RX" /T /C /Q |
              Out-Null
          }
          "granting over the copy took {0:N1} s" -f $t.TotalSeconds

          $c = "C:\probe\octave\octave-cli.exe --norc --no-history --eval " +
               "`"disp (version ())`" > C:\probe\out\oct3.txt 2>&1"
          $rc = [Spawn]::InAppContainer ("devtools-port-probe", $c,
                                         "C:\probe", [ref] $err)
          "octave-cli from the copy: exit $rc, win32 error $err"
          if (Test-Path C:\probe\out\oct3.txt) {
            Get-Content C:\probe\out\oct3.txt
          }

      - name: A low integrity token, which needs no ACE
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          Add-Type -Path spawn.cs
          $root = "C:\octave-ci\octave-$env:OCTAVE_VERSION-w64"
          $sys = "$env:SystemRoot\System32"
          $err = 0

          $c = "$root\octave-cli.exe --norc --no-history --eval " +
               "`"disp (version ())`" > C:\probe\low\oct.txt 2>&1"
          $rc = [Spawn]::AtLowIntegrity ($c, "C:\probe\low", [ref] $err)
          "octave-cli at low integrity: exit $rc, win32 error $err"
          if (Test-Path C:\probe\low\oct.txt) {
            Get-Content C:\probe\low\oct.txt
          }

          $c = "$sys\cmd.exe /c " +
               "(type C:\probe\secret.txt & " +
               "echo x > C:\probe\low-wrote.txt & " +
               "curl.exe -s -m 10 -o nul -w ""http %{http_code}"" " +
               "https://example.com) > C:\probe\low\reach.txt 2>&1"
          $rc = [Spawn]::AtLowIntegrity ($c, "C:\probe\low", [ref] $err)
          "the reach probe at low integrity: exit $rc, win32 error $err"
          if (Test-Path C:\probe\low\reach.txt) {
            Get-Content C:\probe\low\reach.txt
          }
          "wrote outside the low label: " + (Test-Path C:\probe\low-wrote.txt)

      - name: A job object memory cap
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          # The Windows half of measurement 1.  Unlike RLIMIT_AS this is a
          # documented and enforced per-process cap; what is unknown is
          # whether Octave starts under it and whether an allocation past it
          # comes back as Octave's own error rather than a kill.
          Add-Type -Path spawn.cs
          $root = "C:\octave-ci\octave-$env:OCTAVE_VERSION-w64"

          function Cap ($mb, $n, $tag) {
            "--- cap $mb MB, zeros ($n) ---"
            $code = "t = tic; try; x = zeros ($n); " +
                    "printf ('allocated %.2f GB in %.2f s\n', " +
                    "numel (x) * 8 / 2^30, toc (t)); " +
                    "catch e; printf ('refused after %.2f s: %s\n', " +
                    "toc (t), e.message); end_try_catch"
            $c = "$root\octave-cli.exe --norc --no-history --eval " +
                 "`"$code`" > C:\probe\out\$tag.txt 2>&1"
            $e = 0
            $rc = [Spawn]::InJob ($c, "C:\probe", $mb, [ref] $e)
            "exit $rc, win32 error $e"
            if (Test-Path C:\probe\out\$tag.txt) {
              Get-Content C:\probe\out\$tag.txt
            }
          }

          Cap 4096 8000  "job-a"     # 0.5 GB under a 4 GB cap: should pass
          Cap 4096 24000 "job-b"     # 4.6 GB under a 4 GB cap: should refuse
          Cap 512  8000  "job-c"     # does Octave start under half a gigabyte

      - name: Is a stronger confinement available at all
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          # Recorded for the lab image question, not for the runner.
          "--- Windows Sandbox ---"
          Get-WindowsOptionalFeature -Online `
            -FeatureName Containers-DisposableClientVM |
            Select-Object FeatureName, State | Format-List
          "--- Hyper-V ---"
          Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Hyper-V |
            Select-Object FeatureName, State | Format-List

      - name: Upload what the probes captured
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-confinement-output
          path: C:\probe\out
          if-no-files-found: ignore
          retention-days: 14
