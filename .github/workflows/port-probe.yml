name: Port probe

# Temporary.  Two measurements that gate the macOS and Windows sandbox ports,
# per STATUS.md: whether macOS can cap memory at all, and whether the Windows
# filesystem confinement can be had without granting a package SID an ACE on
# the Octave installation.  Manual trigger only, so it never runs beside the
# real CI.  Nothing here fails on a "no": a refusal is the reading.  Delete
# this file once both answers are recorded in the plan.

on:
  workflow_dispatch:
    inputs:
      macos:
        description: 'Run the macOS memory measurement'
        type: boolean
        default: true
      windows:
        description: 'Run the Windows confinement measurement'
        type: boolean
        default: true

permissions:
  contents: read

jobs:

  ## ----------------------------------------------------------------------
  ## Measurement 1.  Can macOS cap memory at all?
  ##
  ## On Linux the cap is one prlimit at relaunch (VmSize + 2 GB), and the
  ## inside check refuses to serve when /proc/self/limits shows no address
  ## space limit.  Darwin accepts RLIMIT_AS and is said not to enforce it,
  ## has no prlimit and no /proc.  Three things must hold for the port to
  ## keep the Linux shape: the limit can be set, it binds, and it can be read
  ## from inside.  Each is measured on its own.
  ## ----------------------------------------------------------------------
  macos-memory:
    name: macOS, can memory be capped
    if: inputs.macos
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: The machine
        run: |
          set +e
          echo "--- arch and release ---"
          uname -a
          sw_vers
          echo "hw.memsize  $(sysctl -n hw.memsize)"
          echo "ncpu        $(sysctl -n hw.ncpu)"
          echo "--- the shell's own limits ---"
          ulimit -a
          echo "--- is there a prlimit ---"
          command -v prlimit || echo "prlimit: absent, as expected"

          # macOS carries no coreutils timeout, and a probe must not be able
          # to wedge: under a 2 GB address space limit Octave was measured on
          # Linux to hang rather than to fail to start.  Perl is on every
          # macOS, so the bound is written once here for the steps below.
          cat > limited <<'PERL'
          #!/usr/bin/perl
          my $t = shift;
          my $killed = 0;
          my $pid = fork ();
          die "fork failed\n" if (! defined $pid);
          if ($pid == 0) { exec @ARGV; exit 127; }
          $SIG{ALRM} = sub { $killed = 1; kill 9, $pid; };
          alarm $t;
          waitpid ($pid, 0);
          my $rc = $?;
          exit ($killed ? 124 : ($rc & 127 ? 128 + ($rc & 127) : $rc >> 8));
          PERL
          chmod +x limited
          ./limited 5 /bin/sh -c 'sleep 60'
          echo "the bound works: exit $? (124 expected)"
          exit 0

      - name: Does RLIMIT_AS bind a C program
        continue-on-error: true
        run: |
          set +e
          cat > alloc.c <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>

          /* Allocate and touch argv[1] megabytes, 64 at a time, reporting how
             far it got.  Nothing is freed, deliberately.  Exit 2 means malloc
             refused, 0 means the whole amount was taken, and a signal means
             the kernel stopped it instead. */
          int main (int argc, char **argv)
          {
            long want = atol (argv[1]), step = 64, got = 0;
            while (got < want)
              {
                char *p = malloc (step * 1024L * 1024L);
                if (p == NULL)
                  {
                    printf ("malloc refused at %ld MB\n", got);
                    fflush (stdout);
                    return 2;
                  }
                memset (p, 1, step * 1024L * 1024L);
                got += step;
              }
            printf ("took and touched %ld MB\n", got);
            return 0;
          }
          C
          cc -O0 -o alloc alloc.c || exit 0

          run () {          # run () <title> <ulimit flag> <value> <ask MB>
            printf -- '--- %s ---\n' "$1"
            (
              ulimit "$2" "$3" 2>/dev/null || echo "ulimit $2 $3 was refused"
              echo "in force: $(ulimit "$2")"
              ./alloc "$4"
              echo "exit status $?"
            )
          }

          run "control, no limit, ask 2048 MB"     -v unlimited 2048
          run "RLIMIT_AS   (-v) 1 GB, ask 2048 MB" -v 1048576   2048
          run "RLIMIT_DATA (-d) 1 GB, ask 2048 MB" -d 1048576   2048
          run "RLIMIT_RSS  (-m) 1 GB, ask 2048 MB" -m 1048576   2048
          exit 0

      - name: Install Octave
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          set -euo pipefail
          brew install octave
          octave-cli --norc --no-history --eval "disp (version ())"

      - name: What Octave reserves at start
        continue-on-error: true
        run: |
          set +e
          # The Linux budget is VmSize + 2 GB, so the port needs a base to add
          # to.  On arm64 the reported virtual size may be so large that no
          # such formula is usable; that is the reading being taken.
          look () {
            printf -- '--- %s ---\n' "$1"
            shift
            env "$@" octave-cli --norc --no-history --eval "pause (25);" &
            pid=$!
            sleep 12
            echo "        VSZ kB      RSS kB"
            ps -o vsz=,rss= -p $pid
            kill -9 $pid 2>/dev/null
            wait $pid 2>/dev/null
          }
          look "default thread count" DEVTOOLS_PROBE=1
          look "one BLAS thread" OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 \
                                 VECLIB_MAXIMUM_THREADS=1
          exit 0

      - name: Does Octave start under a limit, and is an allocation refused
        continue-on-error: true
        run: |
          set +e
          # No prlimit on Darwin, so the relaunch route is a shell that sets
          # the limit and execs.  Whether the limit binds is the question: a
          # zeros () past it should fail with Octave's own error rather than
          # succeed or be killed.
          cat > cap.m <<'M'
          n = str2double (getenv ("PROBE_N"));
          t = tic;
          try
            x = zeros (n);
            printf ("allocated %.2f GB in %.2f s\n", numel (x) * 8 / 2^30, ...
                    toc (t));
          catch err
            printf ("refused after %.2f s: %s\n", toc (t), err.message);
          end_try_catch
          M

          # Every launch is bounded: under a 2 GB cap Octave was measured on
          # Linux to hang rather than to refuse to start, so a probe that did
          # not bound it could not finish.
          said () {
            if [ "$1" -eq 124 ]; then
              echo "exit status 124: it hung and was stopped"
            else
              echo "exit status $1"
            fi
          }
          # Whether setrlimit took the cap, stated rather than inferred from
          # what happened afterwards.
          accepted () {                # accepted () <kb or unlimited>
            if out=$(/bin/sh -c "ulimit -v $1" 2>&1); then
              echo "  the cap was accepted"
            else
              echo "  the cap was REFUSED: $out"
            fi
          }
          start () {                   # start () <kb or unlimited>
            printf -- '--- cap %s kB, does it start ---\n' "$1"
            accepted "$1"
            ./limited 120 /bin/sh -c "ulimit -v $1 2>/dev/null
              exec octave-cli --norc --no-history --eval 'disp (\"started\")'"
            said $?
          }
          try () {                     # try () <kb or unlimited> <N>
            printf -- '--- cap %s kB, zeros (%s) ---\n' "$1" "$2"
            accepted "$1"
            PROBE_N="$2" ./limited 300 /bin/sh -c "ulimit -v $1 2>/dev/null
              exec octave-cli --norc --no-history '$PWD/cap.m'"
            said $?
          }

          echo "### the floor: what cap lets Octave start at all"
          for kb in 2097152 4194304 8388608 16777216; do
            start "$kb"
          done

          # An ask under the cap and an ask over it, so the two answers differ
          # visibly where the cap binds and not at all where it is ignored.
          # 0.48 GB fits any of these caps; 5.84 GB fits none.
          echo "### control, no cap"
          try unlimited 8000
          echo "### an absolute 4 GB cap"
          try 4194304 8000           # 0.48 GB: passes either way
          try 4194304 28000          # 5.84 GB: refused only if the cap binds

          # The Linux cap is not absolute, it is Octave's own size plus a
          # budget, so the same shape is measured here.  Where the virtual
          # size is unusable as a base this arm says so by passing both.
          octave-cli --norc --no-history --eval "pause (25);" &
          pid=$!
          sleep 12
          base=$(ps -o vsz= -p $pid | tr -d ' ')
          kill -9 $pid 2>/dev/null
          wait $pid 2>/dev/null
          echo "### Octave's own size, $base kB, plus a 1 GB budget"
          if [ -n "$base" ]; then
            try $((base + 1048576)) 8000     # 0.48 GB: inside the budget
            try $((base + 1048576)) 16384    # 2.00 GB: outside it
          else
            echo "no virtual size could be read, so no relative cap was tried"
          fi
          exit 0

      - name: Can the limit be read from inside
        continue-on-error: true
        run: |
          set +e
          # The Linux check reads /proc/self/limits.  Darwin has none, so the
          # candidates are a shell (which the confinement may forbid), an
          # oct-file over getrlimit, or an allocation that must fail.  The
          # last is timed here, being the only one that needs nothing.
          cat > inside.m <<'M'
          [s, t] = system ("ulimit -v");
          printf ("through a shell: status %d, %s", s, t);
          t0 = tic;
          try
            x = zeros (40000);
            printf ("the empirical probe did not bind\n");
          catch
            printf ("the empirical probe bound in %.3f s\n", toc (t0));
          end_try_catch
          M
          echo "--- /proc ---"
          ls /proc 2>&1 | head -3 || echo "no /proc, as expected"
          echo "--- what a shell reports under a cap ---"
          /bin/sh -c 'ulimit -v 8388608 2>/dev/null
                      echo "soft $(ulimit -S -v)  hard $(ulimit -H -v)"'
          echo "--- what Octave can see of it under an 8 GB cap ---"
          ./limited 300 /bin/sh -c "ulimit -v 8388608 2>/dev/null
            exec octave-cli --norc --no-history '$PWD/inside.m'"
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "exit status 124: it hung and was stopped"
          else
            echo "exit status $rc"
          fi
          exit 0

      - name: Is Seatbelt reachable at all
        continue-on-error: true
        run: |
          set +e
          # Not the measurement, but the port has no filesystem story without
          # it and the reading is three lines.
          echo "--- sandbox-exec present ---"
          command -v sandbox-exec || echo "absent"
          echo "--- a permissive profile ---"
          sandbox-exec -p '(version 1)(allow default)' /usr/bin/true \
            && echo "ran" || echo "refused, exit $?"
          echo "--- a profile denying the network ---"
          sandbox-exec -p '(version 1)(allow default)(deny network*)' \
            /usr/bin/curl -s -m 10 -o /dev/null https://example.com \
            && echo "the network was NOT blocked" || echo "network blocked"
          exit 0

      - name: What Seatbelt profile does Octave start under
        continue-on-error: true
        run: |
          set +e
          # The one Seatbelt reading so far was a permissive profile with the
          # network punched out of it, which is the opposite of what the
          # sandbox needs.  These go from that control down to `deny default`,
          # and the answer is the tightest one Octave still starts under,
          # together with what it can still reach from inside.
          prefix=$(brew --prefix)
          cli=$(command -v octave-cli)
          echo "brew prefix: $prefix"
          echo "octave-cli:  $cli"
          echo "home:        $HOME"
          echo "secret" > "$HOME/.probe-secret"
          wrap="$PWD/limited"
          work=/private/tmp/devtools-probe
          mkdir -p "$work"

          cat > "$work/sb.m" <<'M'
          printf ("version %s\n", version ());
          f = fopen (fullfile (getenv ("HOME"), ".probe-secret"), "r");
          printf ("home file readable: %d\n", f >= 0);
          if (f >= 0), fclose (f); endif
          f = fopen ("/tmp/devtools-probe-write", "w");
          printf ("tmp writable: %d\n", f >= 0);
          if (f >= 0), fclose (f); endif
          f = fopen (fullfile (getenv ("HOME"), ".probe-write"), "w");
          printf ("home writable: %d\n", f >= 0);
          if (f >= 0), fclose (f); endif
          [s, out] = system ("/usr/bin/true");
          printf ("system () status: %d\n", s);
          M

          ## The control: everything allowed but the network.
          cat > "$work/p1.sb" <<'SB'
          (version 1)
          (allow default)
          (deny network*)
          SB

          ## Read-only but for /tmp, which is where a call's files go.
          cat > "$work/p2.sb" <<'SB'
          (version 1)
          (allow default)
          (deny network*)
          (deny file-write*)
          (allow file-write* (subpath "/private/tmp") (subpath "/tmp"))
          (allow file-write* (literal "/dev/null"))
          SB

          ## Home hidden as well, which bwrap does by not mounting it.
          cat > "$work/p3.sb" <<SB
          (version 1)
          (allow default)
          (deny network*)
          (deny file-write*)
          (allow file-write* (subpath "/private/tmp") (subpath "/tmp"))
          (allow file-write* (literal "/dev/null"))
          (deny file-read* (subpath "$HOME"))
          SB

          ## No program but the interpreter, which bwrap gets by leaving
          ## /usr/bin unmounted and Seatbelt has to state as a rule.
          cat > "$work/p4.sb" <<SB
          (version 1)
          (allow default)
          (deny network*)
          (deny file-write*)
          (allow file-write* (subpath "/private/tmp") (subpath "/tmp"))
          (allow file-write* (literal "/dev/null"))
          (deny file-read* (subpath "$HOME"))
          (deny process-exec*)
          (allow process-exec (subpath "$prefix"))
          SB

          ## The shape the Linux sandbox actually has: nothing but what is
          ## named.  This is the one that decides whether the port keeps its
          ## guarantees or has to weaken them.
          cat > "$work/p5.sb" <<SB
          (version 1)
          (deny default)
          (allow process-fork)
          (allow process-exec (subpath "$prefix"))
          (allow sysctl-read)
          (allow mach-lookup)
          (allow file-read-metadata)
          (allow file-read*
            (subpath "/usr/lib") (subpath "/usr/share") (subpath "/System")
            (subpath "$prefix") (subpath "/private/var/db/dyld")
            (literal "/dev/null") (literal "/dev/random")
            (literal "/dev/urandom") (literal "/dev/dtracehelper"))
          (allow file-read* (subpath "/private/tmp"))
          (allow file-write* (subpath "/private/tmp") (literal "/dev/null"))
          (deny network*)
          SB

          # Run from outside home and read the script from outside it too:
          # one profile makes home unreadable, and the runner's own working
          # directory is inside it, which killed Octave with "unable to find
          # current directory" before the profile meant anything.  The real
          # design puts the server's working directory at the read-only root.
          try_profile () {           # try_profile () <title> <profile>
            printf -- '--- %s ---\n' "$1"
            ( cd "$work" && "$wrap" 120 sandbox-exec -f "$work/$2" "$cli" \
                --norc --no-history "$work/sb.m" )
            rc=$?
            if [ "$rc" -eq 124 ]; then
              echo "it hung and was stopped"
            else
              echo "exit status $rc"
            fi
          }

          printf -- '--- 0: no sandbox at all, for comparison ---\n'
          ( cd "$work" && "$wrap" 120 "$cli" --norc --no-history "$work/sb.m" )
          echo "exit status $?"
          try_profile "1: allow default, deny network" p1.sb
          try_profile "2: and read-only but for /tmp" p2.sb
          try_profile "3: and home unreadable" p3.sb
          try_profile "4: and no program outside the Octave prefix" p4.sb
          try_profile "5: deny default, only what is named" p5.sb

          # What deny default actually needs, asked of Seatbelt rather than
          # guessed at: a traced run emits the rules the process used, which
          # is the profile to build from instead of a list I invented.
          cat > "$work/trace.sb" <<'SB'
          (version 1)
          (trace "/private/tmp/devtools-probe/needed.sb")
          SB
          printf -- '--- what a traced run says Octave needs ---\n'
          ( cd "$work" && "$wrap" 120 sandbox-exec -f "$work/trace.sb" "$cli" \
              --norc --no-history "$work/sb.m" )
          echo "exit status $?"
          if [ -f "$work/needed.sb" ]; then
            echo "the trace holds $(wc -l < "$work/needed.sb") lines:"
            cat "$work/needed.sb"
          else
            echo "no trace file was produced"
          fi
          exit 0

  ## ----------------------------------------------------------------------
  ## Measurement 2.  Windows filesystem confinement without an ACE on the
  ## Octave installation.
  ##
  ## An AppContainer reads only what carries an ACE for its package SID or
  ## for ALL APPLICATION PACKAGES; a managed university lab image may not
  ## permit adding one to the Octave installation.  Three arms: the
  ## AppContainer with and without that ACE, the same over a private copy,
  ## and a low integrity token, which needs no ACE but confines writes only.
  ## The job object memory cap is measured here too, being the Windows half
  ## of measurement 1.
  ## ----------------------------------------------------------------------
  windows-confinement:
    name: Windows, confinement without an ACE
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      OCTAVE_VERSION: '11.3.0'
    steps:
      - uses: actions/checkout@v7

      - name: Install Octave
        uses: pr0m1th3as/octave-ci/windows@v1
        with:
          version: '11.3.0'

      # The probe is one script rather than a step apiece, so that a syntax
      # error is reported here, with every other one in the file beside it,
      # instead of ending the job on the first statement that has one.  A
      # parse costs seconds and a runner round trip costs a quarter of an
      # hour.
      - name: Parse the probe and compile the spawner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = (Resolve-Path .\.github\port-probe\windows.ps1).Path
          $tokens = $null
          $errors = $null
          $parser = [System.Management.Automation.Language.Parser]
          $null = $parser::ParseFile($probe, [ref] $tokens, [ref] $errors)
          if ($errors) {
            "the probe has $($errors.Count) syntax error(s):"
            foreach ($e in $errors) {
              "  line $($e.Extent.StartLineNumber): $($e.Message)"
              "    $($e.Extent.Text)"
            }
            exit 1
          }
          'the probe parses'
          Add-Type -Path "$PWD\.github\port-probe\spawn.cs"
          'the spawner compiles'

      - name: Run the probe
        continue-on-error: true
        shell: pwsh
        run: |
          .\.github\port-probe\windows.ps1 `
            -OctaveVersion $env:OCTAVE_VERSION

      - name: Upload what the probes captured
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-confinement-output
          path: C:\probe\out
          if-no-files-found: ignore
          retention-days: 14
