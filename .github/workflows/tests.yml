name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: pr0m1th3as/octave-ci/.github/workflows/package-test.yml@v1

  # The macOS job above runs the sandbox tests only because
  # __sandboxUsable__ happens to answer that it can.  If that ever stopped
  # being true they would skip and the job would stay green, which is how
  # sandbox mode shipped unable to serve wherever Octave comes from a
  # distribution package.  This job fails if they skip.
  macos-sandbox:
    name: macOS sandbox, Octave from Homebrew
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Octave
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        shell: bash
        run: |
          set -euo pipefail
          brew install octave
          octave-cli --norc --no-history --eval "disp (version ())"

      - name: Build the package archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=package/ -o package.tar.gz HEAD

      - name: Write the check
        shell: bash
        run: |
          cat > sandbox_check.m <<'OCTAVE'
          pkg ("load", "devtools");

          names = {"devtools.sandboxCommand", "devtools.__seatbeltProfile__", ...
                   "devtools.__sandboxCheck__", "devtools.__sandboxLists__", ...
                   "devtools.__sweepCheck__", "devtools.__sweepCall__", ...
                   "devtools.__sandboxUsable__", "devtools.mcpEval"};
          bad = {};
          for i = 1:numel (names)
            if (! test (which (names{i}), "quiet"))
              bad{end+1} = names{i};
            endif
          endfor

          ## A sandbox must be available at all, or everything below proves
          ## nothing by passing.
          why = devtools.__sandboxUsable__ ();
          if (! isempty (why))
            printf ("no sandbox is available here: %s\n", why);
            exit (1);
          endif

          [ok, report] = devtools.selftest ();
          printf ("%s\n", report{:});

          if (any (! cellfun (@isempty, strfind (report, "SKIP  sandbox"))))
            printf ("\nthe sandbox checks skipped, proving nothing.\n");
            exit (1);
          endif
          if (! isempty (bad))
            printf ("\nfailed: %s\n", strjoin (bad, ", "));
            exit (1);
          endif
          if (! ok)
            printf ("\nSELFTEST FAILED\n");
            exit (1);
          endif
          printf ("\nthe sandbox ran and every check passed\n");
          OCTAVE

      - name: Install and run the check
        shell: bash
        run: |
          set -euo pipefail
          octave-cli --norc --no-history \
            --eval "pkg ('install', '-local', '$PWD/package.tar.gz')"
          echo "--- what a sandboxed server says for itself ---"
          octave-cli --norc --no-history --eval \
            "pkg load devtools; devtools.mcpEval ('Sandbox', true)" \
            < /dev/null 2>&1 | head -20 || true
          echo "--- the checks ---"
          octave-cli --norc --no-history \
            --eval "source ('$PWD/sandbox_check.m')"

  # The shared Linux job runs in a plain container, where bwrap is installed and
  # the namespaces it needs are refused, so the sandbox checks skip there and
  # the sandbox is the one thing CI would not cover.  This job gives the
  # container those namespaces, and fails if the checks skip rather than run.
  sandbox:
    name: Linux sandbox, Octave 11.3.0
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Build the package archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=package/ -o package.tar.gz HEAD

      - name: Write the check
        shell: bash
        run: |
          cat > sandbox_check.m <<'OCTAVE'
          pkg ("load", "devtools");

          names = {"devtools.sandboxCommand", "devtools.__sandboxArgs__", ...
                   "devtools.__sandboxCheck__", "devtools.__sandboxLists__", ...
                   "devtools.__sweepCheck__", "devtools.__sweepCall__", ...
                   "devtools.mcpEval"};
          bad = {};
          for i = 1:numel (names)
            if (! test (which (names{i}), "quiet"))
              bad{end+1} = names{i};
            endif
          endfor

          [ok, report] = devtools.selftest ();
          printf ("%s\n", report{:});

          if (any (! cellfun (@isempty, strfind (report, "SKIP  sandbox"))))
            printf ("\nthe sandbox checks skipped, proving nothing.\n");
            exit (1);
          endif
          if (! isempty (bad))
            printf ("\nfailed: %s\n", strjoin (bad, ", "));
            exit (1);
          endif
          if (! ok)
            printf ("\nSELFTEST FAILED\n");
            exit (1);
          endif
          printf ("\nthe sandbox ran and every check passed\n");
          OCTAVE

      - name: Install bubblewrap and run the check
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --volume "$PWD:/work" --workdir /work --user root \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --security-opt systempaths=unconfined \
            --cap-add SYS_ADMIN \
            ghcr.io/gnu-octave/octave:11.3.0 \
            bash -c 'set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq bubblewrap util-linux
              echo "--- can bwrap build its namespaces in this container? ---"
              if bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev \
                   /bin/true; then
                echo "bwrap: yes"
              else
                echo "bwrap: NO, the container refuses the namespaces"
              fi
              octave-cli --norc --no-history \
                --eval "pkg (\"install\", \"-local\", \"/work/package.tar.gz\")"
              echo "--- what a sandboxed server says for itself ---"
              octave-cli --norc --no-history --eval \
                "pkg load devtools; devtools.mcpEval (\"Sandbox\", true)" \
                < /dev/null 2>&1 | head -20 || true
              echo "--- the checks ---"
              octave-cli --norc --no-history \
                --eval "source (\"/work/sandbox_check.m\")"'
